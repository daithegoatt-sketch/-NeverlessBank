name: Sync Neverless Bank Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', '[bank-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bank repository
        uses: actions/checkout@v4
        with:
          path: bank

      - name: Checkout Neverless source
        uses: actions/checkout@v4
        with:
          repository: daithegoatt-sketch/Neverlessbot
          ref: main
          path: source

      - name: Copy bank modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bank/src
          cp source/src/bankSystem.js bank/src/bankSystem.js
          cp source/src/bankUtils.js bank/src/bankUtils.js
          cp source/src/bankVisualBase.js bank/src/bankVisualBase.js
          cp source/src/bankVisualCore.js bank/src/bankVisualCore.js
          cp source/src/bankVisualGames.js bank/src/bankVisualGames.js

      - name: Make bank runtime standalone and migration-safe
        shell: python
        run: |
          from pathlib import Path
          p = Path('bank/src/bankSystem.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace("const { handleMessage: handleFriendshipMessage } = require('./friendshipSystem');\n", "")
          s = s.replace("    handleFriendshipMessage(message).catch((error) => console.error('[friendship] unhandled:', error));\n", "")

          # Migration: old bank records were authored by the original bot. Valid NL bank records
          # are trusted by prefix/parser instead of requiring the current bot author id.
          s = s.replace("      if (message.author?.id !== guild.client.user?.id) continue;\n      const record = parseRecord(message.content);",
                        "      const record = parseRecord(message.content);")

          # Standby mode lets the new bot load/verify the legacy bank data without responding
          # until the old bot is disabled during cutover.
          needle = "async function handleBankMessage(message, client) {\n"
          if needle in s and "BANK_ACTIVE" not in s[s.index(needle):s.index(needle)+250]:
              s = s.replace(needle, needle + "  if (String(process.env.BANK_ACTIVE || '0') !== '1') return false;\n", 1)

          # More dynamic stock movement: small, medium, large and rare major moves in both directions.
          old = """function marketMove() {\n  const roll = Math.random();\n  let magnitude;\n  if (roll < 0.55) magnitude = 0.01 + Math.random() * 0.04;\n  else if (roll < 0.85) magnitude = 0.06 + Math.random() * 0.08;\n  else if (roll < 0.97) magnitude = 0.15 + Math.random() * 0.13;\n  else magnitude = 0.30 + Math.random() * 0.15;\n  return magnitude * (Math.random() < 0.5 ? -1 : 1);\n}\n"""
          new = """function marketMove() {\n  const roll = Math.random();\n  let magnitude;\n  if (roll < 0.35) magnitude = 0.02 + Math.random() * 0.05;\n  else if (roll < 0.70) magnitude = 0.08 + Math.random() * 0.11;\n  else if (roll < 0.92) magnitude = 0.20 + Math.random() * 0.16;\n  else magnitude = 0.40 + Math.random() * 0.30;\n  return magnitude * (Math.random() < 0.5 ? -1 : 1);\n}\n"""
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate source
        working-directory: bank
        run: |
          node --check index.js
          node --check src/bankSystem.js
          node --check src/bankUtils.js
          node --check src/bankVisualBase.js
          node --check src/bankVisualCore.js
          node --check src/bankVisualGames.js

      - name: Commit synchronized bank source
        working-directory: bank
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Neverless Bank Sync"
          git config user.email "actions@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Bank source already current."
            exit 0
          fi
          git commit -m "[bank-sync] sync dedicated bank source"
          git push
